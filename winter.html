<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水彩隨彩畫 - D-凜冬星河</title>
    <link rel="stylesheet" href="css/winter.css">
</head>
<body>

    <!-- 凜冬星空畫布 -->
    <canvas id="starry-canvas"></canvas>

    <div class="container">
        <!-- 頁首區塊 -->
        <header>
            <div class="brand">明日工作室 明日文創</div>
            <div class="title-wrapper">
                <h1>水彩隨彩畫</h1>
            </div>
            <div>
                <span class="subtitle-badge">D - 凜冬星河</span>
            </div>
            <div class="slogan">
                我的行動畫室 <span>沾・水・即・畫</span> 用水彩捕捉冬夜星空的浪漫
            </div>
        </header>

        <!-- 畫作展示網格 (八張縮圖) -->
        <main class="gallery-grid">
            <!-- 卡片 1 -->
            <div class="card" onclick="openModal(0)">
                <div class="image-container">
                    <img src="imgs/winter1.jpg" alt="01 星願小熊" >
                    <div class="zoom-hint">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">
                        <span style="color: var(--accent-purple); margin-right: 8px;">01</span>星願小熊
                    </div>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="card" onclick="openModal(1)">
                <div class="image-container">
                    <img src="imgs/winter2.jpg" alt="02 深海鯨歌" >
                    <div class="zoom-hint">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">
                        <span style="color: var(--accent-purple); margin-right: 8px;">02</span>深海鯨歌
                    </div>
                </div>
            </div>

            <!-- 卡片 3 -->
            <div class="card" onclick="openModal(2)">
                <div class="image-container">
                    <img src="imgs/winter3.jpg" alt="03 雲端禮物" >
                    <div class="zoom-hint">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">
                        <span style="color: var(--accent-purple); margin-right: 8px;">03</span>雲端禮物
                    </div>
                </div>
            </div>

            <!-- 卡片 4 -->
            <div class="card" onclick="openModal(3)">
                <div class="image-container">
                    <img src="imgs/winter4.jpg" alt="04 星願風鈴" >
                    <div class="zoom-hint">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">
                        <span style="color: var(--accent-purple); margin-right: 8px;">04</span>星願風鈴
                    </div>
                </div>
            </div>

            <!-- 卡片 5 -->
            <div class="card" onclick="openModal(4)">
                <div class="image-container">
                    <img src="imgs/winter5.jpg" alt="05 月亮紙船" >
                    <div class="zoom-hint">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">
                        <span style="color: var(--accent-purple); margin-right: 8px;">05</span>月亮紙船
                    </div>
                </div>
            </div>

            <!-- 卡片 6 -->
            <div class="card" onclick="openModal(5)">
                <div class="image-container">
                    <img src="imgs/winter6.jpg" alt="06 紫藤月桂" >
                    <div class="zoom-hint">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">
                        <span style="color: var(--accent-purple); margin-right: 8px;">06</span>紫藤月桂
                    </div>
                </div>
            </div>

            <!-- 卡片 7 -->
            <div class="card" onclick="openModal(6)">
                <div class="image-container">
                    <img src="imgs/winter7.jpg" alt="07 星軌森林" >
                    <div class="zoom-hint">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">
                        <span style="color: var(--accent-purple); margin-right: 8px;">07</span>星軌森林
                    </div>
                </div>
            </div>

            <!-- 卡片 8 -->
            <div class="card" onclick="openModal(7)">
                <div class="image-container">
                    <img src="imgs/winter8.jpg" alt="08 星塵花束" >
                    <div class="zoom-hint">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">
                        <span style="color: var(--accent-purple); margin-right: 8px;">08</span>星塵花束
                    </div>
                </div>
            </div>
        </main>

        <!-- 網頁頁尾 -->
        <footer>
            <div class="footer-logo">明日工作室股份有限公司</div>
            <p>Tomorrow Studio Corp. All Rights Reserved.</p>
            <!--<p style="margin-top: 8px; font-size: 11px; opacity: 0.8;">顏料 ＋ 水筆 ＋ 畫紙 ALL IN ONE，隨時開啟你的行動畫室</p>-->
        </footer>
    </div>

    <!-- 燈箱彈窗 (Lightbox Modal - 精簡無說明 RWD 版) -->
    <div id="image-modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal(event)">✕</button>
            <div class="modal-img-container">
                <img id="modal-img" src="" alt="大圖">
            </div>
            <div class="modal-body">
                <div id="modal-title" class="modal-title"></div>
                <div class="color-palette-label">推薦配色參考色調</div>
                <div id="modal-palette" class="color-palette-guide"></div>
            </div>
        </div>
    </div>

    <!-- ==========================================
       7. 互動 JavaScript 程式碼
       ========================================== -->
    <script src="js/winter.js"></script>
</body>
</html>
